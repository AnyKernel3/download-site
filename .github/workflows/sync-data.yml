name: Sync e/ to data.json
on:
  push:
    branches: [main]
    paths:
      - 'e/**'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate data.json
        run: |
          python3 -c "
          import json,os,time
          o={'updated':int(time.time()),'files':[]}
          if os.path.isdir('e'):
            for r,d,fs in os.walk('e'):
              for f in fs:
                p=os.path.join(r,f)
                o['files'].append({'name':f,'path':os.path.relpath(p,'e'),'size':os.path.getsize(p)})
          o['files'].sort(key=lambda x:x['path'])
          open('data.json','w').write(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          print(len(o['files']),'files synced')
          "
      - name: Commit and push
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "chore: auto-sync data.json from e/"
            git push
          fi